name: prototype

on:
  pull_request:
    paths: ['prototype/**', '.github/workflows/prototype.yml']
  push:
    branches: [main]
    paths: ['prototype/**', '.github/workflows/prototype.yml']

# A newer push to the same PR makes the running suite obsolete.
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Software WebGL is slow and GitHub runners vary (the same 3D test took 20 s on one, 45 s on
    # another), so the suite is split over 6 fresh runners, one test at a time on each
    # (see playwright.config.js).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototype
    env:
      PW_CHANNEL: chromium # bundled Chromium with software WebGL; see playwright.config.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Same suite as `npm test`, against the production bundle. Budget measurements
      # (`npm run test:orcamento`) need real hardware and stay out of CI.
      - run: npm run test:build -- --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: test-results-${{ matrix.shard }}
          path: prototype/test-results/
